[project]
name = "ass1-text-classification"
version = "0.1.0"
description = "NYT text classification with bag of words, word embeddings and BERT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "gensim==4.4.0",
  "torch==2.6.0",
  "transformers==4.51.3",
  "matplotlib==3.10.3",
  "reportlab==4.4.1",
  "pytest==8.3.5",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
